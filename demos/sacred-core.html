    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #05040c;
      }

      .sac-demo-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        padding-top: 56px;
        pointer-events: none;
        z-index: 5;
      }

      .sac-badge {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 6px 14px;
        border-radius: 4px;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ffd27a;
        margin-bottom: 18px;
      }

      .sac-title {
        font-size: clamp(28px, 3.6vw, 44px);
        font-weight: 700;
        color: #ffffff;
        margin: 0 0 14px 0;
      }

      .sac-description {
        font-size: clamp(14px, 1.4vw, 16px);
        line-height: 1.6;
        color: #94a3b8;
        max-width: 460px;
        margin: 0;
      }

      .sac-theme-switcher {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        padding: 18px;
        background: #05040c;
      }

      .sac-theme-switcher button {
        background: #111827;
        color: #e5e7eb;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
      }

      .sac-theme-switcher button.active {
        outline: 2px solid #ffffff;
      }
    </style>
  </head>

    <script>
      const preview = document.getElementById("sac-preview");
      const buttons = document.querySelectorAll(".sac-theme-switcher button");

      buttons.forEach((btn) =>
        btn.addEventListener("click", () => {
          buttons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const theme = btn.getAttribute("data-theme");
          preview.className = theme ? `sacred-core ${theme}` : "sacred-core";
        }),
      );
